<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skogbergsholmen · Midsummer 2026</title>
    <meta
      name="description"
      content="A private midsummer gathering on the Åland Islands."
    />
    <script>
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (!isLocal) {
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = './assets/styles.css';
        document.head.appendChild(stylesheet);

        const prodScript = document.createElement('script');
        prodScript.type = 'module';
        prodScript.src = './assets/index.js';
        document.body.appendChild(prodScript);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script id="dev-entry" type="module" src="./src/main.tsx"></script>
  </body>
</html>
