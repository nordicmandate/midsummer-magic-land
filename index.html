<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skogbergsholmen · Midsummer 2026</title>
    <meta
      name="description"
      content="A private midsummer gathering on the Åland Islands."
    />
    <script>
      (function () {
        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocal) {
          // Development loader: inject Vite client immediately and defer dev entry until body exists
          try {
            const client = document.createElement('script');
            client.type = 'module';
            client.src = '/@vite/client';
            document.head && document.head.appendChild(client);

            const devEntrySrc = './src/main.tsx';
            function injectDevEntry() {
              try {
                const devEntry = document.createElement('script');
                devEntry.type = 'module';
                devEntry.src = devEntrySrc;
                document.body && document.body.appendChild(devEntry);
              } catch (e) {}
            }

            if (document.readyState === 'loading') {
              window.addEventListener('DOMContentLoaded', injectDevEntry);
            } else {
              injectDevEntry();
            }
          } catch (e) {
            /* ignore */
          }
          return;
        }
        // If a module entry script is already present (Vite dev or built asset), don't inject duplicates
        if (
          document.querySelector(
            'script[type="module"][src^="/src/main.tsx"], script[type="module"][src$="/assets/index.js"], script[type="module"][src*="assets/index.js"]'
          )
        ) {
          return;
        }

        function inject() {
          try {
            const stylesheet = document.createElement('link');
            stylesheet.rel = 'stylesheet';
            stylesheet.href = './assets/styles.css';
            document.head && document.head.appendChild(stylesheet);

            const prodScript = document.createElement('script');
            prodScript.type = 'module';
            prodScript.src = './assets/index.js';
            prodScript.onerror = async function () {
              try {
                // Fallback: fetch the script and import as blob (bypass MIME issues)
                const resp = await fetch('./assets/index.js');
                const text = await resp.text();
                const blob = new Blob([text], { type: 'text/javascript' });
                const blobUrl = URL.createObjectURL(blob);
                await import(blobUrl);
              } catch (err) {
                console.error('Module fallback failed', err);
              }
            };

            document.body && document.body.appendChild(prodScript);
          } catch (e) {
            console.error('Asset injection failed', e);
          }
        }

        if (document.readyState === 'loading') {
          window.addEventListener('DOMContentLoaded', inject);
        } else {
          inject();
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/styles.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
