<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skogbergsholmen · Midsummer 2026</title>
    <meta
      name="description"
      content="A private midsummer gathering on the Åland Islands."
    />
    <script>
      (function () {
        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocal) return;

        function inject() {
          try {
            const stylesheet = document.createElement('link');
            stylesheet.rel = 'stylesheet';
            stylesheet.href = './assets/styles.css';
            document.head && document.head.appendChild(stylesheet);

            const prodScript = document.createElement('script');
            prodScript.type = 'module';
            prodScript.src = './assets/index.js';
            document.body && document.body.appendChild(prodScript);
          } catch (e) {
            console.error('Asset injection failed', e);
          }
        }

        if (document.readyState === 'loading') {
          window.addEventListener('DOMContentLoaded', inject);
        } else {
          inject();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script id="dev-entry" type="module" src="./src/main.tsx"></script>
  </body>
</html>
